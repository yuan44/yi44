<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双板块跳转</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: system-ui, sans-serif;
        }

        .container {
            display: flex;
            gap: 40px;
        }

        .board {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 200px;
            border-radius: 24px;
            text-decoration: none;
            font-size: 1.6rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .board:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(0,0,0,0.12);
        }

        .board-tech {
            background: #2b6e8f;
            color: #fff;
        }

        .board-life {
            background: #c26b4b;
            color: #fff;
        }

        @media (max-width: 500px) {
            .container {
                flex-direction: column;
                gap: 24px;
            }
            .board {
                width: 160px;
                height: 160px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://developer.mozilla.org/zh-CN/" class="board board-tech">技术笔记</a>
        <a href="https://www.bing.com" class="board board-life">生活随笔</a>
    </div>
</body>
</html>
