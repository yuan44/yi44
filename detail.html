    <h1>风掠过窗台的时候</h1>
    <div class="meta">2026‑09‑09 · 随感</div>
    <div class="article">
      <p>午后常常有一阵很轻的风，从窗缝钻进来，翻几页摊开的本子。</p >
      <p>阳光斜斜落在纸面上，有一点暖，但不至于燥热。我有时候就趴在桌边，看着书页轻轻晃动，什么也不去想。</p >
      <div class="note">
        生活里很多温柔的时刻，都是不请自来的。
      </div>
      <p>以前总觉得每一天都要留下点“成果”才算值得，后来慢慢发觉，允许自己有一段松散、没有产出的时间，也是一种必要的休息。</p >
      <p>就像这阵风，它不用带来什么特别的东西，仅仅来过，就已经很好。</p >
    </div>
