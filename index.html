<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yuan · 赛博博客</title>
  <style>
    /* 全局重置与赛博底色 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0c0f;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* 赛博网格与扫描线氛围 */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(0deg, rgba(0, 255, 255, 0.03) 0px, rgba(0, 255, 255, 0.03) 2px, transparent 2px, transparent 6px),
        repeating-linear-gradient(90deg, rgba(255, 0, 255, 0.03) 0px, rgba(255, 0, 255, 0.03) 2px, transparent 2px, transparent 6px);
      pointer-events: none;
      z-index: 1;
    }

    /* 霓虹光晕背景 */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.15) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    /* 主卡片——终端/全息界面 */
    .blog-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 800px;
      background: rgba(10, 15, 20, 0.75);
      backdrop-filter: blur(8px);
      border: 2px solid #0ff;
      box-shadow: 
        0 0 15px #0ff,
        0 0 30px rgba(0, 255, 255, 0.4),
        inset 0 0 20px rgba(0, 255, 255, 0.2);
      border-radius: 20px;
      padding: 2rem 1.8rem;
      transition: box-shadow 0.3s ease;
    }

    /* 增加细节：四角装饰 */
    .blog-container::before,
    .blog-container::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border-style: solid;
      border-color: #ff00ff;
      filter: drop-shadow(0 0 5px #ff00ff);
    }

    .blog-container::before {
      top: -8px;
      left: -8px;
      border-width: 4px 0 0 4px;
    }

    .blog-container::after {
      bottom: -8px;
      right: -8px;
      border-width: 0 4px 4px 0;
    }

    /* 博主名字头部 */
    .blog-header {
      text-align: center;
      margin-bottom: 2.2rem;
      border-bottom: 1px solid rgba(0, 255, 255, 0.5);
      padding-bottom: 1rem;
      position: relative;
    }

    .blog-header h1 {
      font-size: 3.2rem;
      letter-spacing: 6px;
      font-weight: 700;
      text-transform: uppercase;
      color: #0ff;
      text-shadow: 
        0 0 5px #0ff,
        0 0 15px #0ff,
        0 0 30px #0ff,
        2px 2px 0 #ff00ff;
      animation: flicker 3s infinite alternate;
    }

    .blog-header .sub {
      color: #ff00ff;
      text-shadow: 0 0 8px #ff00ff;
      font-size: 0.9rem;
      letter-spacing: 4px;
      margin-top: 0.5rem;
      text-transform: uppercase;
      opacity: 0.9;
    }

    @keyframes flicker {
      0% { opacity: 1; text-shadow: 0 0 5px #0ff, 0 0 15px #0ff, 0 0 30px #0ff, 2px 2px 0 #ff00ff; }
      50% { opacity: 0.9; text-shadow: 0 0 2px #0ff, 0 0 8px #0ff, 0 0 18px #0ff, 2px 2px 0 #ff00ff; }
      100% { opacity: 1; text-shadow: 0 0 10px #0ff, 0 0 25px #0ff, 0 0 45px #0ff, 2px 2px 0 #ff00ff; }
    }

    /* 下拉菜单区域 */
    .nav-dropdown {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 2rem 0 1.5rem;
      position: relative;
    }

    /* 下拉触发按钮 (主菜单) */
    .dropdown-btn {
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 1.5rem;
      letter-spacing: 2px;
      padding: 0.9rem 1.5rem;
      text-transform: uppercase;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      cursor: pointer;
      box-shadow: 
        0 0 10px rgba(0, 255, 255, 0.5),
        inset 0 0 10px rgba(0, 255, 255, 0.2);
      text-shadow: 0 0 8px #0ff;
      transition: all 0.2s;
      border-radius: 8px;
      background: rgba(0, 255, 255, 0.05);
    }

    .dropdown-btn:hover {
      background: rgba(0, 255, 255, 0.15);
      box-shadow: 
        0 0 18px #0ff,
        0 0 30px rgba(0, 255, 255, 0.6),
        inset 0 0 15px #0ff;
      color: #fff;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
      border-color: #fff;
    }

    /* 下拉箭头 */
    .dropdown-btn .arrow {
      display: inline-block;
      transition: transform 0.3s;
      font-size: 1.8rem;
      line-height: 1;
      filter: drop-shadow(0 0 6px #0ff);
    }

    /* 下拉列表 (初始隐藏) */
    .dropdown-menu {
      list-style: none;
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.2rem;
      padding-left: 0.5rem;
      border-left: 3px solid #ff00ff;
      filter: drop-shadow(0 0 8px #ff00ff);
      animation: glitchIn 0.25s ease;
    }

    .dropdown-menu.show {
      display: flex;
    }

    /* 每个下拉项链接 */
    .dropdown-menu li a {
      display: block;
      padding: 0.9rem 1.2rem;
      background: rgba(20, 20, 30, 0.8);
      border: 1px solid #ff00ff;
      color: #ffb3ff;
      text-decoration: none;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.2s;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(255, 0, 255, 0.3);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 链接前赛博标识 */
    .dropdown-menu li a::before {
      content: "▹";
      color: #0ff;
      text-shadow: 0 0 8px #0ff;
      font-size: 1.4rem;
      transition: transform 0.2s;
    }

    .dropdown-menu li a:hover {
      background: rgba(255, 0, 255, 0.2);
      color: #fff;
      border-color: #0ff;
      box-shadow: 
        0 0 15px #ff00ff,
        0 0 25px rgba(255, 0, 255, 0.8),
        inset 0 0 8px #ff00ff;
      text-shadow: 0 0 8px #fff, 0 0 15px #ff00ff;
      transform: translateX(5px);
    }

    .dropdown-menu li a:hover::before {
      content: "➤";
      color: #ff00ff;
      text-shadow: 0 0 12px #ff00ff;
      transform: scale(1.2);
    }

    @keyframes glitchIn {
      0% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* 博客简介与状态区 */
    .blog-footer {
      margin-top: 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed #0ff;
      padding-top: 1.2rem;
      font-size: 0.85rem;
      color: #0ff;
      text-shadow: 0 0 5px #0ff;
      letter-spacing: 1px;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #0f0;
      border-radius: 50%;
      box-shadow: 0 0 10px #0f0;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .blog-footer .right {
      color: #ff00ff;
      text-shadow: 0 0 6px #ff00ff;
    }

    /* 选中文本样式 */
    ::selection {
      background: #ff00ff;
      color: #0a0c0f;
      text-shadow: none;
    }

    /* 响应式调整 */
    @media (max-width: 500px) {
      .blog-container {
        padding: 1.5rem 1rem;
      }
      .blog-header h1 {
        font-size: 2.4rem;
        letter-spacing: 4px;
      }
      .dropdown-btn {
        font-size: 1.2rem;
        padding: 0.7rem 1rem;
      }
      .dropdown-menu li a {
        font-size: 1rem;
        padding: 0.7rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="blog-container">
    <!-- 头部：博主名字 -->
    <div class="blog-header">
      <h1>yuan</h1>
      <div class="sub">// 赛博空间 · 个人日志</div>
    </div>

    <!-- 下拉式导航（可点击跳转） -->
    <div class="nav-dropdown">
      <button class="dropdown-btn" id="dropdownToggle">
        <span>⚡ 导航菜单</span>
        <span class="arrow" id="arrowIcon">▼</span>
      </button>
      <ul class="dropdown-menu" id="dropdownMenu">
        <li><a href="#" onclick="handleNavClick('首页'); return false;">首页 · 神经连接</a></li>
        <li><a href="#" onclick="handleNavClick('文章'); return false;">文章 · 数据碎片</a></li>
        <li><a href="#" onclick="handleNavClick('项目'); return false;">项目 · 义体改造</a></li>
        <li><a href="#" onclick="handleNavClick('关于'); return false;">关于 · 幽灵协议</a></li>
        <li><a href="#" onclick="handleNavClick('联系'); return false;">联系 · 暗网信号</a></li>
      </ul>
    </div>

    <!-- 底部状态区 -->
    <div class="blog-footer">
      <div><span class="status-dot"></span> 在线 · 信号稳定</div>
      <div class="right">© yuan // 2077</div>
    </div>
  </div>

  <script>
    (function() {
      // 获取元素
      const toggleBtn = document.getElementById('dropdownToggle');
      const dropdownMenu = document.getElementById('dropdownMenu');
      const arrowIcon = document.getElementById('arrowIcon');

      // 切换下拉菜单显示/隐藏
      toggleBtn.addEventListener('click', function(e) {
        e.stopPropagation();  // 防止冒泡影响
        const isOpen = dropdownMenu.classList.contains('show');
        if (isOpen) {
          dropdownMenu.classList.remove('show');
          arrowIcon.style.transform = 'rotate(0deg)';
          arrowIcon.textContent = '▼';
        } else {
          dropdownMenu.classList.add('show');
          arrowIcon.style.transform = 'rotate(180deg)';
          arrowIcon.textContent = '▲'; // 视觉上更清晰
        }
      });

      // 点击页面其他位置关闭菜单（赛博风格可选，但为了体验，保留）
      document.addEventListener('click', function(e) {
        const container = document.querySelector('.nav-dropdown');
        if (container && !container.contains(e.target)) {
          dropdownMenu.classList.remove('show');
          arrowIcon.style.transform = 'rotate(0deg)';
          arrowIcon.textContent = '▼';
        }
      });

      // 阻止菜单内部点击时关闭（点击链接时另行处理）
      dropdownMenu.addEventListener('click', function(e) {
        e.stopPropagation();
      });

      // 模拟跳转及反馈 (赛博风提示)
      window.handleNavClick = function(pageName) {
        // 显示一个终端风格的提示 (不干扰原有布局)
        const toast = document.createElement('div');
        toast.textContent = `[ 跳转至: ${pageName} ]`;
        toast.style.position = 'fixed';
        toast.style.bottom = '30px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.background = '#0a0c0f';
        toast.style.color = '#0ff';
        toast.style.border = '1px solid #0ff';
        toast.style.padding = '12px 24px';
        toast.style.borderRadius = '30px';
        toast.style.fontFamily = "'Share Tech Mono', monospace";
        toast.style.letterSpacing = '2px';
        toast.style.boxShadow = '0 0 20px #0ff, 0 0 40px rgba(0,255,255,0.5)';
        toast.style.zIndex = '9999';
        toast.style.textShadow = '0 0 8px #0ff';
        toast.style.backdropFilter = 'blur(4px)';
        toast.style.fontSize = '1rem';
        toast.style.transition = 'opacity 0.3s';
        toast.style.pointerEvents = 'none';

        document.body.appendChild(toast);

        // 0.8秒后淡出移除
        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => {
            if (toast.parentNode) toast.remove();
          }, 300);
        }, 800);

        // 实际的页面跳转行为：在此可改为真实链接
        // 但为了演示，我们用模拟跳转
        // 如果想真实跳转，可将下面注释打开并替换对应URL
        // window.location.href = 'https://example.com/' + pageName.toLowerCase(); 
        
        // 同时关闭下拉菜单
        dropdownMenu.classList.remove('show');
        arrowIcon.style.transform = 'rotate(0deg)';
        arrowIcon.textContent = '▼';
      };

      // 页面加载时的小细节：初始化箭头方向
      arrowIcon.style.transform = 'rotate(0deg)';
    })();
  </script>
</body>
</html>
