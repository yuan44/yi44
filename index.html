<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲录</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "Noto Serif SC", serif;
  background: #f4f1eb;
  color: #2c2c2c;
  line-height: 1.72;
}
.wrap {
  max-width: 700px;
  margin: 0 auto;
  padding: 36px 22px;
}
header {
  border-bottom: 1px solid #d8d2c6;
  padding-bottom: 18px;
  margin-bottom: 42px;
}
h1 {
  font-size: 26px;
  font-weight: 500;
  letter-spacing: 0.6px;
}
.sub {
  margin-top: 5px;
  font-size: 14px;
  color: #6b6b6b;
}
.list {
  display: flex;
  flex-direction: column;
  gap: 26px;
}
.item {
  background: #fff;
  border: 1px solid #e2ddd3;
  border-radius: 8px;
  padding: 24px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.item:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.05);
}
.item a {
  text-decoration: none;
  color: inherit;
  display: block;
}
.tit {
  font-size: 19px;
  font-weight: 500;
  margin-bottom: 7px;
}
.info {
  font-size: 13px;
  color: #868686;
  margin-bottom: 9px;
}
.desc {
  font-size: 15px;
  color: #545454;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
footer {
  margin-top: 64px;
  text-align: center;
  font-size: 13px;
  color: #949494;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>闲录</h1>
    <p class="sub">随便记下一些细碎的时刻</p >
  </header>

  <div class="list">
    <div class="item">
      <a href=" ">
        <div class="tit">傍晚的风</div>
        <div class="info">2026‑09‑08 · 日常</div>
        <div class="desc">傍晚出门走一走，风裹着一点凉，天色慢慢沉下来。很多时候不用特意找什么意义，只是单纯地感受这一刻就很好。</div>
      </a >
    </div>
    <div class="item">
      <a href="article.html">
        <div class="tit">习惯与松弛</div>
        <div class="info">2026‑09‑01 · 随想</div>
        <div class="desc">以前总觉得要把每一天安排得满满当当才算充实，后来慢慢明白，允许自己偶尔松懈，也是生活里很重要的一部分。</div>
      </a >
    </div>
    <div class="item">
      <a href="article.html">
        <div class="tit">安静的角落</div>
        <div class="info">2026‑08‑22 · 碎片</div>
        <div class="desc">不需要很宏大的场景，一张桌子、一盏灯，就可以让人安安静静地待上很久，整理思绪或者什么都不想。</div>
      </a >
    </div>
  </div>

  <footer>© 2026 · 闲录</footer>
</div>
</body>
</html>
