<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的博客</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background-color: #f5f6f7;
  color: #222;
}
/* 顶部蓝栏 */
.header-bar {
  background-color: #3474a7;
  color: #ffffff;
  padding: 20px 24px;
}
.header-bar h1 {
  font-size: 22px;
  font-weight: 500;
}
.header-bar p {
  font-size: 14px;
  opacity: 0.85;
  margin-top: 4px;
}
/* 容器 */
.container {
  max-width: 700px;
  margin: 30px auto;
  padding: 0 20px;
}
/* 文章卡片 */
.card {
  background: #ffffff;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  transition: transform 0.22s ease, box-shadow 0.22s ease;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.09);
}
.card a {
  text-decoration: none;
  color: inherit;
  display: block;
}
.card h2 {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #1a1a1a;
}
.meta {
  font-size: 13px;
  color: #868686;
  margin-bottom: 12px;
}
.excerpt {
  font-size: 15px;
  color: #4e4e4e;
  line-height: 1.7;
}
.footer {
  text-align: center;
  margin-top: 50px;
  font-size: 13px;
  color: #aaaaaa;
}
</style>
</head>
<body>
<div class="header-bar">
  <h1>我的博客</h1>
  <p>记录折腾博客与日常的碎片</p >
</div>

<div class="container">
  <!-- 第1个可跳转板块 -->
  <div class="card">
    <a href="post.html ">
      <h2>全新的开始</h2>
      <div class="meta">发表于 2026‑09‑12</div>
      <div class="excerpt">
        为了速度更迅捷，使用的是 Hugo+Go。在 Github 使用过程里踩了不少坑，慢慢摸索着把博客搭了起来。
      </div>
    </a >
  </div>

  <!-- 第2个可跳转板块 -->
  <div class="card">
    <a href="post.html">
      <h2>我的第一篇博客</h2>
      <div class="meta">发表于 2026‑09‑11</div>
      <div class="excerpt">
        最开始尝试了 Hexo 蝴蝶主题，一路疯狂报错，磕磕绊绊总算跑通，算是很特别的起点。
      </div>
    </a >
  </div>

  <div class="footer">© 2026 我的博客</div>
</div>
</body>
</html>
