<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #f3e8ff;
            color: #2d1b4e;
            line-height: 1.7;
        }
        header {
            background: #7b2cbf;
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.3);
        }
        nav a {
            color: #f0e6ff;
            text-decoration: none;
            margin: 0 16px;
            font-size: 16px;
            transition: 0.3s;
        }
        nav a:hover {
            color: #ffd6ff;
        }
        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .article-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 3px 10px rgba(123, 44, 191, 0.15);
            transition: 0.3s ease;
            cursor: pointer;
        }
        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(123, 44, 191, 0.25);
        }
        .article-card h2 {
            color: #7b2cbf;
            margin-bottom: 8px;
        }
        .date {
            color: #9d77bd;
            font-size: 14px;
            margin-bottom: 14px;
        }
        .read-more {
            display: inline-block;
            margin-top:12px;
            padding:6px 14px;
            background:#9d4edd;
            color:white;
            text-decoration:none;
            border-radius:8px;
            transition:0.3s;
        }
        .read-more:hover{
            background:#7b2cbf;
        }
        footer {
            text-align: center;
            padding:30px;
            color:#7c589e;
            font-size:14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>你好，祝你每天开心</h1>
        <nav>
        </nav>
    </header>

    <div class="container">
        <div class="article-card">
            <h2>周报</h2>
            <div class="date">2026‑09‑10</div>
            <p></p >
            <a href="#" class="read-more">阅读全文</a >
        </div>
        <div class="article-card">
            <h2>题解</h2>
            <div class="date">2026‑09‑08</div>
            <p></p >
            <a href="#" class="read-more">阅读全文</a >
        </div>
        <div class="article-card">
            <h2>最后</h2>
            <div class="date">2026‑09‑05</div>
            <p>感谢观看</p >
            <a href="#" class="read-more">阅读全文</a >
        </div>
    </div>

    <footer>
        © 2026 紫色个人博客
    </footer>
</body>
</html>
